[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_SITE_ENV = "production"

[context.branch-deploy]
  command = "npm run build && printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers"

[context.branch-deploy.environment]
  VITE_SITE_ENV = "staging"

# Vite puts a content hash in every filename under /assets, so a file never changes under the same name:
# cache for a year. HTML pages are NOT covered and keep Netlify's default (always revalidated),
# so a new deploy is picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"