<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale-1.0" />
    <meta name="theme-color" content="#1A1A1A" />

    <!-- Fallback title only. SeoHead sets the real title, description,
         canonical, robots, OG, Twitter and all JSON-LD on every route.
         index.html must never carry those tags (D26). -->
    <title>IT Legends | Managed IT Support in Gauteng</title>

    <!-- The H1 is the LCP element, so the font is the critical resource.
         crossorigin is required on font preloads, or the file is fetched twice. -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
